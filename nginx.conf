server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Portal 只有首頁一個畫面，沒有裝 router——但任何路徑（舊的 /login、
    # /login/success，或使用者隨手打的東西）都不該回 404。一律回 index.html，
    # 再由 src/main.tsx 開頭那兩行把網址列收回 "/"。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
